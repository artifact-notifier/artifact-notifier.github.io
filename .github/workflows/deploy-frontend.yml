name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Public API URL (e.g. https://xxx.trycloudflare.com)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Priority: manual input > repo/env `API_BASE_URL` variable > (optional) secret
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || secrets.API_BASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Build (base-href Pages)
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          # User/org repo (<owner>.github.io) is served from the root -> base-href /
          # Otherwise (project pages) -> base-href /<repo>/
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/${REPO}/"
          fi
          echo "Base href: $BASE_HREF"
          node_modules/.bin/ng build --base-href "$BASE_HREF"

      - name: Inject API URL into assets/api-config.json
        run: |
          FILE="dist/artifact-notifier-frontend/browser/assets/api-config.json"
          URL="${API_BASE_URL:-}"
          # Normalize: trim + strip trailing /
          URL="$(echo "$URL" | xargs)"
          URL="${URL%%/}"
          echo "API_BASE_URL=${URL:-<same-origin>}"
          if [ -z "$URL" ]; then
            echo "WARNING: empty API_BASE_URL -> same-origin (the trycloudflare API won't be reachable from Pages)."
            echo "  Set it via: Settings > Secrets and variables > Actions > Variables > API_BASE_URL"
          fi
          printf '{ "apiBaseUrl": "%s" }\n' "$URL" > "$FILE"
          cat "$FILE"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist/artifact-notifier-frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
