sonar.projectKey=artifact-notifier_artifact-notifier.github.io
sonar.organization=artifact-notifier
sonar.projectName=artifact-notifier.github.io

sonar.sources=backend/src,backend/prisma/schema.prisma,backend/Dockerfile,frontend/src,deploy,.github
sonar.tests=backend/src,backend/test,frontend/src,frontend/e2e
sonar.exclusions=**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts,backend/test/**,frontend/e2e/**

# lcov files produced by the CI test jobs (paths rewritten from the repo root)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
# entry points, wiring and static dictionaries carry no testable logic
sonar.coverage.exclusions=backend/src/main.ts,backend/src/**/*.module.ts,frontend/src/main.ts,frontend/src/app/app.config.ts,frontend/src/app/app.routes.ts,frontend/src/app/core/i18n.service.ts,backend/src/i18n/**,deploy/**,.github/**,backend/Dockerfile
